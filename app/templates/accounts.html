<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>accountpage</title>
</head>
<body>
    <h1>
         {%  if users %}
            {% for user in users %}
                <p>{{ user.username }}</p>
                <p>{{ user.created_at }}</p>
                <p>{{ user.email }}</p>
            {% endfor %}
        {% endif %}
        {% if not users %}
            No users found.
        {% endif %}
    </h1>
</body>
</html>
